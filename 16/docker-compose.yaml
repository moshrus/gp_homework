services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - F:\project\grafana\prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - gp-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    environment:
      DATA_SOURCE_NAME: ""
    ports:
      - "9187:9187"
    restart: always
    networks:
      - gp-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    restart: always
    networks:
      - gp-network
      
networks:
  gp-network:
    external: true